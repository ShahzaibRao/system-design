<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - Social Lab</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Signup</h1>
    <form id="signup-form">
      <label for="username">Username</label>
      <input type="text" id="username" required minlength="3">
      <div id="username-status"></div>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="5">
      <button type="submit" id="signup-button">Signup</button>
    </form>
    <div id="message"></div>
    <p>What this page demonstrates: live username check uses the Bloom filter from Chapter 04, signup uses bcrypt from Chapter 02, MongoDB from Chapter 03.</p>
  </div>
  <script src="/static/signup.js"></script>
</body>
</html>
