services:
  mongo:
    image: mongo:7
    container_name: social-lab-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  mongo2:
    image: mongo:7
    container_name: social-lab-mongo2
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    command: ["--replSet", "rs0", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  mongo3:
    image: mongo:7
    container_name: social-lab-mongo3
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    command: ["--replSet", "rs0", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  app:
    build: .
    container_name: social-lab-app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/backend/app
      - ./frontend:/code/frontend
    environment:
      - MONGO_URI=mongodb://social-lab-mongo:27017,social-lab-mongo2:27017,social-lab-mongo3:27017/?replicaSet=rs0&readPreference=secondaryPreferred
      - REDIS_HOST=redis
    depends_on:
      - mongo
      - mongo2
      - mongo3
      - redis
    restart: unless-stopped

  config:
    image: mongo:7
    container_name: social-lab-config
    ports:
      - "27020:27017"
    volumes:
      - config_data:/data/db
    command: ["--configsvr", "--port", "27017", "--dbpath", "/data/db", "--replSet", "configrs", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  shard1:
    image: mongo:7
    container_name: social-lab-shard1
    ports:
      - "27021:27017"
    volumes:
      - shard1_data:/data/db
    command: ["--shardsvr", "--port", "27017", "--dbpath", "/data/db", "--replSet", "shard1rs", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  shard2:
    image: mongo:7
    container_name: social-lab-shard2
    ports:
      - "27022:27017"
    volumes:
      - shard2_data:/data/db
    command: ["--shardsvr", "--port", "27017", "--dbpath", "/data/db", "--replSet", "shard2rs", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  shard3:
    image: mongo:7
    container_name: social-lab-shard3
    ports:
      - "27023:27017"
    volumes:
      - shard3_data:/data/db
    command: ["--shardsvr", "--port", "27017", "--dbpath", "/data/db", "--replSet", "shard3rs", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  mongos:
    image: mongo:7
    container_name: social-lab-mongos
    ports:
      - "27024:27017"
    command: ["mongos", "--configdb", "configrs/social-lab-config:27017", "--bind_ip_all"]
    depends_on:
      - config
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: social-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: social-lab-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: social-lab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  mongo_data:
  mongo2_data:
  mongo3_data:
  prometheus_data:
  grafana_data:
  redis_data:
  config_data:
  shard1_data:
  shard2_data:
  shard3_data:
