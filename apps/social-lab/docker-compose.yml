services:
  mongo:
    image: mongo:7
    container_name: social-lab-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  mongo2:
    image: mongo:7
    container_name: social-lab-mongo2
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    command: ["--replSet", "rs0", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  mongo3:
    image: mongo:7
    container_name: social-lab-mongo3
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    command: ["--replSet", "rs0", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped

  app:
    build: .
    container_name: social-lab-app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/backend/app
      - ./frontend:/code/frontend
    environment:
      - MONGO_URI=mongodb://social-lab-mongo:27017,social-lab-mongo2:27017,social-lab-mongo3:27017/?replicaSet=rs0&readPreference=secondaryPreferred
      - REDIS_HOST=redis
    depends_on:
      - mongo
      - mongo2
      - mongo3
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: social-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: social-lab-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: social-lab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  mongo_data:
  mongo2_data:
  mongo3_data:
  prometheus_data:
  grafana_data:
  redis_data:
